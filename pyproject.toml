[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nist-rag"
version = "0.1.0"
description = "A small conversational RAG application for the NIST AI RMF documents"
requires-python = ">=3.10,<3.14"
dependencies = [
    "langgraph==1.2.11",
    "langchain-core==1.6.2",
    "qdrant-client==1.19.0",
    "fastembed==0.7.4",
    "rank-bm25==0.2.2",
    "httpx[socks]==0.28.1",
    "pypdf==6.17.0",
    "python-dotenv==1.2.3",
    "pydantic==2.13.5",
    "tokenizers==0.23.2",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.16.6"]

[project.scripts]
nist-rag = "nist_rag.cli:main"

[tool.setuptools.packages.find]
include = ["nist_rag*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
